# Checklist configuration - Outcome Definition only
# Focuses exclusively on extracting plain-language outcome definitions.

# User instruction
user_instruction: |
  Extract the outcome definitions from the medical review documents.
# Task-specific constraints
constraints:
  - "Extract EVERY distinct value of this checklist item found in any document."
  - "Create separate entries for each unique value with its supporting evidence."
  - "Each extracted value should be self-contained with relevant context included."
# Single checklist item
checklist_items:
  Outcome_Definition:
    description: "How an outcome is explained or operationalized in plain language — definitions or descriptions that clarify what the outcome means or how it is measured (e.g., 'serious adverse event: any event requiring hospitalization', 'remission: PHQ-9 score below 5'). Extract each definition as a separate value, formatted as: '[outcome name]: [plain-language definition]'."
