# Checklist configuration - Magnitude Descriptor only
# Focuses exclusively on extracting qualitative magnitude qualifiers of effects.

# User instruction
user_instruction: |
  Extract the magnitude descriptors of effects from the medical review documents.
# Task-specific constraints
constraints:
  - "Extract EVERY distinct value of this checklist item found in any document."
  - "Create separate entries for each unique value with its supporting evidence."
  - "Each extracted value should be self-contained with relevant context included."
# Single checklist item
checklist_items:
  Magnitude_Descriptor:
    description: "Qualitative magnitude qualifiers used to describe effect size in plain language (e.g., 'slightly', 'little to no', 'small', 'moderate', 'large', 'substantial'). These are the verbal hedges authors use alongside numerical results. Do not include the numerical effect itself — that belongs in Quantitative_Data. Extract each magnitude descriptor as a separate value, linking to its outcome when stated, formatted as: '[outcome]: [magnitude descriptor]'."
