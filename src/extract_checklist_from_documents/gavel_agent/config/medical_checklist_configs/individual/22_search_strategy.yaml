# Checklist configuration - Search Strategy only
# Focuses exclusively on extracting the literature search strategy.

# User instruction
user_instruction: |
  Extract the search strategy from the medical review documents.
# Task-specific constraints
constraints:
  - "Extract EVERY distinct value of this checklist item found in any document."
  - "Create separate entries for each unique value with its supporting evidence."
  - "Each extracted value should be self-contained with relevant context included."
# Single checklist item
checklist_items:
  Search_Strategy:
    description: "How the literature search was conducted — databases searched, search dates, inclusion of grey literature, language restrictions (e.g., 'MEDLINE, EMBASE, and Cochrane CENTRAL searched through January 2025', 'no language restrictions', 'included unpublished trial registry entries'). Extract each distinct element as a separate value, or as one comprehensive value if the review describes it succinctly."
