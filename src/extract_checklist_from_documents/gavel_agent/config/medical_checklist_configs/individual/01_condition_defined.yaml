# Checklist configuration - Condition Defined only
# Focuses exclusively on extracting the condition under review.

# User instruction
user_instruction: |
  Extract the condition under review from the medical review documents.
# Task-specific constraints
constraints:
  - "Extract EVERY distinct value of this checklist item found in any document."
  - "Create separate entries for each unique value with its supporting evidence."
  - "Each extracted value should be self-contained with relevant context included."
# Single checklist item
checklist_items:
  Condition_Defined:
    description: "The health condition, disease, or clinical problem the review investigates, as explicitly stated. Capture the condition name with any qualifiers describing stage, severity, subtype, or anatomical site (e.g., 'type 2 diabetes mellitus', 'major depressive disorder', 'post-stroke upper-limb spasticity'). Do not include disease mechanism, prevalence, or burden — those belong in Condition_Background. Extract each distinct condition as a separate value."
