# Checklist configuration - Intervention Defined only
# Focuses exclusively on extracting the intervention being studied.

# User instruction
user_instruction: |
  Extract the intervention being studied from the medical review documents.
# Task-specific constraints
constraints:
  - "Extract EVERY distinct value of this checklist item found in any document."
  - "Create separate entries for each unique value with its supporting evidence."
  - "Each extracted value should be self-contained with relevant context included."
# Single checklist item
checklist_items:
  Intervention_Defined:
    description: "The treatment, exposure, intervention, or strategy being studied, including drug name(s) and class, dose, route, device, behavior, or program (e.g., 'metformin 500 mg twice daily, oral', 'cognitive behavioral therapy weekly sessions', 'whole-grain dietary intervention'). Do not capture the comparator — that belongs in Comparator_Defined. Do not capture the mechanism — that belongs in Intervention_Rationale. Extract each distinct intervention as a separate value."
