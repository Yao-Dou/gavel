# Checklist configuration - Harm Direction only
# Focuses exclusively on extracting the direction of effect for harm/safety outcomes.

# User instruction
user_instruction: |
  Extract the direction of harm effects from the medical review documents.
# Task-specific constraints
constraints:
  - "Extract EVERY distinct value of this checklist item found in any document."
  - "Create separate entries for each unique value with its supporting evidence."
  - "Each extracted value should be self-contained with relevant context included."
# Single checklist item
checklist_items:
  Harm_Direction:
    description: "The stated direction of effect for harm/safety outcomes (e.g., 'increase in adverse events', 'no difference in serious harms', 'reduction in gastrointestinal side effects'). Format as: '[harm outcome]: [direction]'."
