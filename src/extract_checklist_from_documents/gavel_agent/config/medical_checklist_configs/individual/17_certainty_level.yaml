# Checklist configuration - Certainty Level only
# Focuses exclusively on extracting certainty/confidence ratings of findings.

# User instruction
user_instruction: |
  Extract the certainty levels of findings from the medical review documents.
# Task-specific constraints
constraints:
  - "Extract EVERY distinct value of this checklist item found in any document."
  - "Create separate entries for each unique value with its supporting evidence."
  - "Each extracted value should be self-contained with relevant context included."
# Single checklist item
checklist_items:
  Certainty_Level:
    description: "The confidence/certainty rating expressed by the review for a given finding (e.g., 'very low certainty', 'low certainty', 'moderate certainty', 'high certainty', 'very uncertain', 'GRADE: moderate'). Extract each certainty rating as a separate value, linked to the outcome, formatted as: '[outcome]: [certainty level]'."
