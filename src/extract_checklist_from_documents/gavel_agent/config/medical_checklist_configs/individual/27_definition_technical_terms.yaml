# Checklist configuration - Definition of Technical Terms only
# Focuses exclusively on extracting plain-language definitions of technical terms.

# User instruction
user_instruction: |
  Extract the definitions of technical terms from the medical review documents.
# Task-specific constraints
constraints:
  - "Extract EVERY distinct value of this checklist item found in any document."
  - "Create separate entries for each unique value with its supporting evidence."
  - "Each extracted value should be self-contained with relevant context included."
# Single checklist item
checklist_items:
  Definition_Technical_Terms:
    description: "Plain-language explanations of medical, statistical, or methodological terminology used in the review (e.g., 'odds ratio: a measure comparing the odds of an outcome between two groups', 'placebo: an inactive treatment used for comparison'). Extract each defined term as a separate value, formatted as: '[term]: [plain-language definition]'."
