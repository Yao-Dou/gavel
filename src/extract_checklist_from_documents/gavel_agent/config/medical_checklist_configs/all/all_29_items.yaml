# Checklist configuration - defines the items to extract and user instructions
# Medical review plain-language summarization: 29 items across 6 thematic groups.

# User instruction - what the user wants the agent to do
# This will be included in the prompt sent to the LLM
user_instruction: |
  Extract all 29 checklist items from the medical review documents as completely as possible.

# Optional: Task-specific constraints beyond what's in the system prompt
# Leave empty ([]) if standard extraction rules apply
# Add constraints here only for special requirements specific to this task
constraints:
  - "Extract EVERY distinct value of each checklist item that directly matches the item's definition."
  - "When multiple values exist for a checklist item, create separate extracted entries for each value."
  - "Be thorough with items that commonly have multiple values: outcomes, study designs, certainty levels, quantitative findings, etc."
  - "Each extracted value should be self-contained and easy to read, so you can include important context if needed."

# Checklist items to extract
# Grouped here by thematic class for readability; the loader treats them as a flat dict.
checklist_items:

  # ---- Group 1: Clinical Question Structure ----

  Condition_Defined:
    description: "The health condition, disease, or clinical problem the review investigates, as explicitly stated. Capture the condition name with any qualifiers describing stage, severity, subtype, or anatomical site (e.g., 'type 2 diabetes mellitus', 'major depressive disorder', 'post-stroke upper-limb spasticity'). Do not include disease mechanism, prevalence, or burden — those belong in Condition_Background. Extract each distinct condition as a separate value."

  Population_Defined:
    description: "The group(s) of people the evidence applies to, defined by age, sex, demographic, clinical status, setting, or comorbidities (e.g., 'adults aged 65+ with mild cognitive impairment', 'pregnant women at <20 weeks gestation', 'children under 5 in low-resource settings'). This is the population-level scope of the review, distinct from Inclusion_Criteria (which describes criteria for studies eligible for inclusion). Extract each distinct population as a separate value, formatted as: '[population descriptor]'."

  Intervention_Defined:
    description: "The treatment, exposure, intervention, or strategy being studied, including drug name(s) and class, dose, route, device, behavior, or program (e.g., 'metformin 500 mg twice daily, oral', 'cognitive behavioral therapy weekly sessions', 'whole-grain dietary intervention'). Do not capture the comparator — that belongs in Comparator_Defined. Do not capture the mechanism — that belongs in Intervention_Rationale. Extract each distinct intervention as a separate value."

  Comparator_Defined:
    description: "The control condition, placebo, usual care, alternative treatment, or no-treatment arm against which the intervention is compared (e.g., 'placebo', 'usual care', 'standard pharmacotherapy', 'sham acupuncture', 'no intervention'). If multiple comparators are described, extract each as a separate value. Do not extract the intervention itself — that belongs in Intervention_Defined."

  Timing_Intervention:
    description: "The timing, duration, frequency, or treatment period of the intervention itself (e.g., 'daily for 12 weeks', 'single dose at week 0', 'continuous use for ≥6 months'). This is timing of the intervention, distinct from Outcome_Timeframe (when outcomes were measured). Extract each timing descriptor as a separate value."

  Purpose_Aim:
    description: "The explicit aim, objective, or research question of the review — what the review sought to determine, paraphrased or quoted from the review (e.g., 'To assess the effects of statins on cardiovascular mortality in adults', 'To evaluate the safety and efficacy of GLP-1 agonists for weight loss in obese adults without diabetes'). Typically a single value per review; extract each distinct stated aim if multiple."

  # ---- Group 2: Outcomes Specification ----

  Primary_Benefit_Outcome:
    description: "The primary benefit (efficacy) outcome the review evaluates — the main efficacy endpoint pre-specified by the authors. Include only outcomes the review explicitly labels as primary, main, or central. Do not include secondary efficacy outcomes (use Secondary_Benefit_Outcome) or safety/adverse-effect outcomes (use Harm_Safety_Outcome). Extract each primary outcome as a separate value, formatted as: '[outcome name]: [brief definition or measurement scale, if given]'."

  Secondary_Benefit_Outcome:
    description: "Additional benefit (efficacy) outcomes that are not labeled primary — outcomes the review tracks alongside the primary endpoint to provide a fuller picture of efficacy. Do not include adverse-effect outcomes (use Harm_Safety_Outcome) or the primary outcome (use Primary_Benefit_Outcome). Extract each secondary benefit outcome as a separate value."

  Harm_Safety_Outcome:
    description: "Unwanted effects, adverse events, harms, side effects, or safety outcomes assessed by the review (e.g., 'serious adverse events', 'gastrointestinal bleeding', 'all-cause mortality'). Include both common and serious harms when both are reported. Do not include benefit outcomes (use Primary_Benefit_Outcome or Secondary_Benefit_Outcome). Extract each harm or safety outcome as a separate value."

  Outcome_Timeframe:
    description: "When (after intervention start) outcomes were assessed (e.g., 'at 12 weeks', 'at 1 year', 'at end of treatment', 'at 30 days post-discharge'). Distinct from Timing_Intervention (the duration of the intervention itself). Extract each timeframe as a separate value, linking to the outcome when possible, formatted as: '[outcome]: [timeframe]'."

  Outcome_Definition:
    description: "How an outcome is explained or operationalized in plain language — definitions or descriptions that clarify what the outcome means or how it is measured (e.g., 'serious adverse event: any event requiring hospitalization', 'remission: PHQ-9 score below 5'). Extract each definition as a separate value, formatted as: '[outcome name]: [plain-language definition]'."

  # ---- Group 3: Results Reporting ----

  Benefit_Direction:
    description: "The stated direction of effect for benefit outcomes (e.g., 'increase', 'decrease', 'no difference', 'improvement', 'reduction', 'little to no difference'). Extract directional findings per outcome. Do not include effects on harms (use Harm_Direction). Format as: '[outcome]: [direction]'."

  Harm_Direction:
    description: "The stated direction of effect for harm/safety outcomes (e.g., 'increase in adverse events', 'no difference in serious harms', 'reduction in gastrointestinal side effects'). Format as: '[harm outcome]: [direction]'."

  Magnitude_Descriptor:
    description: "Qualitative magnitude qualifiers used to describe effect size in plain language (e.g., 'slightly', 'little to no', 'small', 'moderate', 'large', 'substantial'). These are the verbal hedges authors use alongside numerical results. Do not include the numerical effect itself — that belongs in Quantitative_Data. Extract each magnitude descriptor as a separate value, linking to its outcome when stated, formatted as: '[outcome]: [magnitude descriptor]'."

  Quantitative_Data:
    description: "Numerical results reported in the review — risk ratios, odds ratios, hazard ratios, mean differences, percentages, absolute risk differences, NNT, confidence intervals, p-values, etc. (e.g., 'RR 0.75, 95% CI 0.60 to 0.94', '15% vs 22% (absolute reduction 7%)', 'mean difference -2.3 points (95% CI -3.5 to -1.1)'). Extract each numerical result as a separate value, linking the figure to the outcome and comparison when available."

  Evidence_Absence:
    description: "Explicit statements that no data, no studies, or insufficient evidence was found for an outcome or comparison (e.g., 'No studies reported on long-term mortality', 'We found no eligible trials for this comparison'). Do not infer absence; require explicit statements. Closely related to Evidence_Gaps but narrower: Evidence_Absence is for direct no-data statements, while Evidence_Gaps covers broader limitations. Extract each absence statement as a separate value, formatted as: '[outcome/topic]: no data found' or quote the relevant phrasing."

  # ---- Group 4: Certainty and Evidence Quality ----

  Certainty_Level:
    description: "The confidence/certainty rating expressed by the review for a given finding (e.g., 'very low certainty', 'low certainty', 'moderate certainty', 'high certainty', 'very uncertain', 'GRADE: moderate'). Extract each certainty rating as a separate value, linked to the outcome, formatted as: '[outcome]: [certainty level]'."

  Reason_Downgrading:
    description: "Reasons given for a lower certainty rating, such as study limitations, risk of bias, imprecision, inconsistency, indirectness, publication bias, or small sample size (e.g., 'downgraded for risk of bias and imprecision'). Extract each downgrading reason as a separate value linked to the outcome, formatted as: '[outcome]: [reason(s) for downgrading]'."

  Study_Design:
    description: "The study design(s) of the studies included in the review (e.g., 'RCTs', 'cluster-randomized trials', 'observational cohort studies', 'cross-over trials'). This refers to designs of the included primary studies, not the review's own design. Extract each distinct study design as a separate value."

  Number_Studies:
    description: "The total number of studies included in the review (e.g., '12 studies', '34 RCTs included'). If multiple counts exist (e.g., per comparison or per subgroup), extract each with context, formatted as: '[count]: [scope/comparison]'."

  Total_Sample_Size:
    description: "The total number of participants across all included studies (e.g., 'N = 4,532 participants', '2,108 patients across 12 trials'). If reported per comparison or per arm, extract each with context."

  Search_Strategy:
    description: "How the literature search was conducted — databases searched, search dates, inclusion of grey literature, language restrictions (e.g., 'MEDLINE, EMBASE, and Cochrane CENTRAL searched through January 2025', 'no language restrictions', 'included unpublished trial registry entries'). Extract each distinct element as a separate value, or as one comprehensive value if the review describes it succinctly."

  Inclusion_Criteria:
    description: "Eligibility criteria the review used to include or exclude studies (e.g., 'RCTs only', 'adults ≥18 years', 'studies with ≥12 weeks follow-up', 'published in English'). These are criteria for studies, not for participants within studies (participant-level criteria belong in Population_Defined). Extract each criterion as a separate value."

  Evidence_Gaps:
    description: "Missing outcomes, populations, comparisons, or settings the review notes as having insufficient data (e.g., 'No studies in children', 'Limited data on long-term safety', 'No head-to-head trials versus newer agents'). Broader than Evidence_Absence: includes gaps and limitations beyond direct no-data statements. Extract each gap as a separate value."

  # ---- Group 5: Contextual / Background Information ----

  Condition_Background:
    description: "Disease mechanism, prevalence, progression, natural history, burden, or pathophysiology described as context (e.g., 'Alzheimer''s disease is a progressive neurodegenerative disorder affecting approximately 50 million people worldwide'). Context about the condition itself, distinct from Condition_Defined (which states what condition the review studies). Extract each background statement as a separate value."

  Intervention_Rationale:
    description: "The biological, behavioral, or theoretical reason the intervention is expected to work — its mechanism of action or hypothesized pathway (e.g., 'SSRIs increase synaptic serotonin levels, hypothesized to alleviate depressive symptoms'). Distinct from Intervention_Defined (which is what the intervention is). Extract each rationale as a separate value."

  Definition_Technical_Terms:
    description: "Plain-language explanations of medical, statistical, or methodological terminology used in the review (e.g., 'odds ratio: a measure comparing the odds of an outcome between two groups', 'placebo: an inactive treatment used for comparison'). Extract each defined term as a separate value, formatted as: '[term]: [plain-language definition]'."

  # ---- Group 6: Applicability & Currency ----

  Applicability:
    description: "Statements about whom the findings apply to, where they generalize, or explicit limits on generalizability (e.g., 'Findings apply primarily to adults aged 18–65 in high-income settings; generalizability to children or low-resource settings is unclear'). Extract each applicability statement as a separate value."

  Evidence_Currency:
    description: "How up-to-date the review is — search date, publication date, or any explicit currency statement (e.g., 'Search current to March 2024', 'Last updated in 2023'). Extract each currency-related statement as a separate value."
